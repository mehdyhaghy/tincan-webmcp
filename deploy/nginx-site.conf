# TinCan WebMCP demo site. nginx only terminates TLS on 443; the Bun API on
# 127.0.0.1:8787 serves the built Vue app, the demo API, and /_tincan/issues.
# There is deliberately no port 80 server block.
server {
    # The combined form works on nginx 1.24 (Ubuntu 24.04) and newer, where it only warns.
    listen 443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:tincan:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Above MAX_INCIDENT_BYTES (256 kB) so oversized reports get the API's own 413.
    client_max_body_size 512k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite rather than append so the API sees only the address nginx observed.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
